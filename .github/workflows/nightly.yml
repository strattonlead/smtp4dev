name: Nightly

# The pull request gate in build.yml excludes two test sets: E2E.WebUI needs Playwright browsers
# installed and MemoryLeakStress runs for minutes. This fork is never contributed upstream, so its
# own tests are the only regression net there is and those exclusions are holes in it. This runs
# them on a schedule so the holes are covered within a day rather than never.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

env:
  DOTNET_VERSION: '10.0.x'
  NODE_VERSION: '20'
  DOTNET_NOLOGO: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'

jobs:
  excluded-tests:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: WebUI E2E
            filter: FullyQualifiedName~E2E.WebUI
            playwright: true
          - name: Memory leak stress
            filter: FullyQualifiedName~MemoryLeakStress
            playwright: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: Rnwood.Smtp4dev/ClientApp/package-lock.json

      - name: Restore
        run: dotnet restore Rnwood.Smtp4dev.Tests/Rnwood.Smtp4dev.Tests.csproj

      - name: Build
        run: dotnet build Rnwood.Smtp4dev.Tests/Rnwood.Smtp4dev.Tests.csproj -c Release --no-restore

      - name: Install Playwright browsers
        if: matrix.playwright
        run: pwsh Rnwood.Smtp4dev.Tests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: Test
        # GitHub hosted runners have no IPv6 stack; see the note in build.yml.
        env:
          SMTP4DEV_E2E_ARGS: --disableipv6
        run: >
          dotnet test Rnwood.Smtp4dev.Tests/Rnwood.Smtp4dev.Tests.csproj
          -c Release --no-build
          --filter "${{ matrix.filter }}"
          --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-${{ strategy.job-index }}
          path: '**/TestResults/*.trx'
          if-no-files-found: warn
