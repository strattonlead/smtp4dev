name: Build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_VERSION: '10.0.x'
  NODE_VERSION: '20'
  DOTNET_NOLOGO: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: Rnwood.Smtp4dev/ClientApp/package-lock.json

      - name: Restore
        run: dotnet restore Rnwood.Smtp4dev.Tests/Rnwood.Smtp4dev.Tests.csproj

      - name: Build
        run: dotnet build Rnwood.Smtp4dev.Tests/Rnwood.Smtp4dev.Tests.csproj -c Release --no-restore

      - name: Test
        # GitHub hosted runners have no IPv6 stack. ImapServer binds IPAddress.IPv6Any with no
        # AddressFamilyNotSupported fallback, so without --disableipv6 the IMAP listener fails to
        # start and every E2E test burns its full 180s startup timeout.
        #
        # WebUI tests need Playwright browsers and MemoryLeakStress is a long running stress test,
        # so both are excluded here.
        env:
          SMTP4DEV_E2E_ARGS: --disableipv6
        run: >
          dotnet test Rnwood.Smtp4dev.Tests/Rnwood.Smtp4dev.Tests.csproj
          -c Release --no-build
          --filter "FullyQualifiedName!~E2E.WebUI&FullyQualifiedName!~MemoryLeakStress"
          --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: warn

  publish:
    name: Publish ${{ matrix.rid }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # All of these cross compile from the x64 runner - a self contained publish just pulls the
        # target runtime pack from NuGet, so the arm targets need no extra runner or emulation.
        rid:
          - linux-x64
          - linux-musl-x64
          - linux-arm
          - linux-arm64
          - win-x64
          - win-arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: Rnwood.Smtp4dev/ClientApp/package-lock.json

      - name: Publish
        run: |
          set -euo pipefail
          version_arg=()
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version_arg=("-p:Version=${GITHUB_REF#refs/tags/v}")
          fi
          dotnet publish Rnwood.Smtp4dev/Rnwood.Smtp4dev.csproj \
            -c Release \
            -r "${{ matrix.rid }}" \
            --self-contained \
            -p:PublishSingleFile=true \
            "${version_arg[@]}" \
            -o "out/${{ matrix.rid }}"

      - name: Package
        run: |
          set -euo pipefail
          mkdir -p dist
          if [[ "${{ matrix.rid }}" == win-* ]]; then
            (cd out && zip -qr "../dist/smtp4dev-${{ matrix.rid }}.zip" "${{ matrix.rid }}")
          else
            tar -czf "dist/smtp4dev-${{ matrix.rid }}.tar.gz" -C out "${{ matrix.rid }}"
          fi

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: smtp4dev-${{ matrix.rid }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: smtp4dev-*
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/}"
          gh release create "$tag" dist/* --title "$tag" --generate-notes

  docker:
    name: Docker image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: Rnwood.Smtp4dev/ClientApp/package-lock.json

      - name: Publish framework dependent build
        # Dockerfile.linux runs on the aspnet runtime image and expects the published output in
        # ./out, so this is a plain framework dependent publish rather than the self contained
        # single file publish the release binaries use.
        run: |
          set -euo pipefail
          version_arg=()
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version_arg=("-p:Version=${GITHUB_REF#refs/tags/v}")
          fi
          dotnet publish Rnwood.Smtp4dev/Rnwood.Smtp4dev.csproj \
            -c Release \
            "${version_arg[@]}" \
            -o out

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tag
        id: meta
        run: |
          set -euo pipefail
          # Tags are immutable and always exact. There is deliberately no latest and no main tag:
          # a moving engine tag makes a downstream deployment irreproducible.
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "tag=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
            echo "push=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag=ghcr.io/${GITHUB_REPOSITORY,,}:ci-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
            echo "push=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.linux
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.meta.outputs.push == 'true' }}
          tags: ${{ steps.meta.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=BSD-3-Clause
            org.opencontainers.image.description=smtp4dev, patched for Deadletter. See docs/FORK-CHANGES.md.
            smtp4dev.upstream.ref=${{ github.ref_name }}
